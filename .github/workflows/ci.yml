name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Test
        run: npm test
      - name: Validate Compose
        env:
          API_SECRET: ci-only-secret-do-not-use-in-production-123456
          ENCRYPTION_KEY: ci-only-encryption-key-do-not-use-123456
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag specboard:ci .
