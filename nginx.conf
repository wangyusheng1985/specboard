events {}
http {
  upstream specboard_api { server api:3000; }
  server {
    listen 3443 ssl;
    listen [::]:3443 ssl;
    server_name 10.9.34.84;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { proxy_pass http://specboard_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
  }
}
