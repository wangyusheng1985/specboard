<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Specboard · 工作看板</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><a class="skip" href="#board">跳转到看板</a><header><a class="brand" href="/">S<span>Specboard</span></a><span class="subtitle">从想法到实现，让工作持续向前。</span><nav><button id="connect">连接</button><button id="projects">项目配置</button><button class="primary" id="new-task">创建任务</button></nav></header>
<main><div class="heading"><div><p class="eyebrow">WORKSPACE / ALL PROJECTS</p><h1>全局工作看板</h1><p>探索问题，规划方案，交付结果。</p></div><button id="refresh">刷新看板</button></div><p id="notice" role="status" aria-live="polite"></p><div id="board" tabindex="-1" class="board"></div></main>
<dialog id="connect-dialog"><form id="connect-form"><h2>连接工作空间</h2><p>输入部署时配置的访问密钥。密钥仅用于建立短期连接，不会保存在浏览器中。</p><label>访问密钥<input name="secret" type="password" required autocomplete="current-password"></label><p class="form-error" role="alert"></p><div class="actions"><button type="button" data-close>取消</button><button class="primary">连接</button></div></form></dialog>
<dialog id="project-dialog"><form id="project-form"><h2>配置 GitLab 项目</h2><p>项目会出现在所有任务的项目选择器中。</p><label>项目名称<input name="name" required maxlength="150"></label><label>仓库 HTTPS 地址<input name="repositoryUrl" type="url" placeholder="https://gitlab.com/team/project.git" required></label><label>GitLab API Token<input name="apiToken" type="password" required autocomplete="off"></label><label>默认分支<input name="defaultBranch" value="main" required></label><p class="form-error" role="alert"></p><div class="actions"><button type="button" data-close>取消</button><button class="primary">验证并保存</button></div></form><section><h3>已配置项目</h3><ul id="project-list"></ul></section></dialog>
<dialog id="task-dialog"><form id="task-form"><h2>创建任务</h2><p>任务将进入 Explore，并根据描述开始探索。</p><label>所属项目<select name="projectId" required id="project-select"></select></label><label>你希望完成什么？<textarea name="description" rows="5" maxlength="20000" required placeholder="描述问题、期望结果和已有约束…"></textarea></label><p class="form-error" role="alert"></p><div class="actions"><button type="button" data-close>取消</button><button class="primary">开始探索</button></div></form></dialog>
<dialog id="detail-dialog" class="detail"><div class="detail-head"><div><p class="eyebrow" id="detail-project"></p><h2 id="detail-title"></h2></div><button data-close aria-label="关闭任务详情">关闭</button></div><div id="stage-tabs" class="tabs" role="tablist" aria-label="阶段记录"></div><div id="detail-meta"></div><div class="controls"><button data-control="pause">暂停</button><button data-control="resume">继续</button><button data-control="retry">重试</button><button data-control="stop">停止</button><button id="advance">进入下一阶段</button></div><div id="proposal"></div><div id="messages" class="messages" role="log" aria-label="阶段对话"></div><details><summary>执行记录与结果</summary><div id="runs"></div></details><form id="message-form"><label>补充信息<textarea name="text" rows="3" required placeholder="补充需求，或输入“进入 Propose”请求转移…"></textarea></label><div class="actions"><button class="primary">发送消息</button></div></form></dialog>
</body></html>
